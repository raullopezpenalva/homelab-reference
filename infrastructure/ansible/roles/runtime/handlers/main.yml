---
- name: Reload reference systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart reference containerd
  ansible.builtin.systemd_service:
    name: containerd
    state: restarted
    daemon_reload: true

- name: Restart reference Docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
    daemon_reload: true
