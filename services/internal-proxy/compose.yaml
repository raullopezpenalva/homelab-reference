name: reference-ingress
services:
  gateway:
    image: ${NGINX_IMAGE:?Set reviewed NGINX_IMAGE}
    restart: unless-stopped
    ports: ["${LAB_BIND_ADDRESS:-127.0.0.1}:8085:8080"]
    environment:
      LAB_DOMAIN: ${LAB_DOMAIN:-lab.example.com}
      APPLICATION_UPSTREAM: ${APPLICATION_UPSTREAM:?Set private application upstream}
      GRAFANA_UPSTREAM: ${GRAFANA_UPSTREAM:?Set private Grafana upstream}
      CI_UPSTREAM: ${CI_UPSTREAM:?Set private CI upstream}
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp/generated
    command: [nginx, -c, /etc/nginx/reference.conf, -g, "daemon off;"]
    volumes:
      - ./nginx.conf:/etc/nginx/reference.conf:ro
      - ./default.conf.template:/etc/nginx/templates/default.conf.template:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
