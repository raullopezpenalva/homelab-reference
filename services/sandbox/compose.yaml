name: reference-sandbox
services:
  web:
    image: ${NGINX_IMAGE:?Set reviewed NGINX_IMAGE}
    restart: unless-stopped
    ports: ["${LAB_BIND_ADDRESS:-127.0.0.1}:8082:8080"]
    volumes: [./index.html:/usr/share/nginx/html/index.html:ro]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    networks: [sandbox]
networks:
  sandbox: {}
