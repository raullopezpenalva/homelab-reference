name: reference-applications
services:
  proxy:
    image: ${NGINX_IMAGE:?Set reviewed NGINX_IMAGE}
    restart: unless-stopped
    ports:
      - "${LAB_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy
    networks: [http]
  api:
    image: ${API_IMAGE:?Build and review the reference API image}
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_NAME: lab_demo
      DB_USER: reference_reader
      DB_PASSWORD_FILE: /run/secrets/database_app
    secrets: [database_app]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [http, app_data]
networks:
  http: {}
  app_data:
    name: reference-app-data
    external: true
secrets:
  database_app:
    file: ${LAB_SECRET_DIR:?Set external secret directory}/database_app
