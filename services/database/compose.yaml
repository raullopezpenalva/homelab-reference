name: reference-database
services:
  database:
    image: ${POSTGRES_IMAGE:?Set reviewed POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: lab_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/database_admin
    secrets: [database_admin, database_app]
    volumes:
      - database:/var/lib/postgresql/data
      - ./init.sh:/docker-entrypoint-initdb.d/10-reference.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d lab_demo"]
      interval: 10s
      timeout: 5s
      retries: 12
    shm_size: 128m
    mem_limit: 768m
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options: {max-size: 10m, max-file: '3'}
    networks:
      app_data:
        aliases: [database]
networks:
  app_data:
    name: reference-app-data
    internal: true
volumes:
  database: {}
secrets:
  database_admin:
    file: ${LAB_SECRET_DIR:?Set external secret directory}/database_admin
  database_app:
    file: ${LAB_SECRET_DIR:?Set external secret directory}/database_app
