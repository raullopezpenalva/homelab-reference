name: reference-telemetry
services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:?Set reviewed PROMETHEUS_IMAGE}
    restart: unless-stopped
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=7d, --storage.tsdb.retention.size=2GB]
    ports: ["${LAB_BIND_ADDRESS:-127.0.0.1}:9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules.yml:/etc/prometheus/rules.yml:ro
      - metrics:/prometheus
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    networks: [metrics]
  grafana:
    image: ${GRAFANA_IMAGE:?Set reviewed GRAFANA_IMAGE}
    restart: unless-stopped
    ports: ["${LAB_BIND_ADDRESS:-127.0.0.1}:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: labadmin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    secrets: [grafana_admin]
    volumes:
      - dashboards:/var/lib/grafana
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ./dashboard-provider.yml:/etc/grafana/provisioning/dashboards/reference.yml:ro
      - ./datasource.yml:/etc/grafana/provisioning/datasources/reference.yml:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    networks: [metrics]
networks:
  metrics: {}
volumes:
  metrics: {}
  dashboards: {}
secrets:
  grafana_admin:
    file: ${LAB_SECRET_DIR:?Set external secret directory}/grafana_admin
